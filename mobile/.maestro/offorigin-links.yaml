appId: codes.madera.crossfog
---
# A link the page keeps (Leaflet's zoom control, href="#") must not open the browser: the origin check
# has to leave in-app links alone.
- runFlow: subflows/open-panel.yaml
- tapOn: "Zoom in"
- waitForAnimationToEnd
- assertVisible: "Expand or collapse panel"
- assertNotVisible:
    label: "Browser not opened"
    id: ".*:id/url_bar"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Expand or collapse panel"
    timeout: 60000
# Leaflet's own attribution link has no target and the basemap's has one: both must leave the app and leave the bundled
# page in place. The #138 failure is a race (a late JS answer lets the load through), so each link is tapped three times.
- repeat:
    times: 3
    commands:
      - runFlow:
          file: subflows/tap-attribution.yaml
          env:
            LINK: ".*Leaflet"
      - runFlow:
          file: subflows/tap-attribution.yaml
          env:
            LINK: "OpenStreetMap"
