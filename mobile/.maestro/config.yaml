# history.yaml is not listed: it runs on its own on a debug build (its header says why).
# history-release.yaml proves #139 only on a Release build (its header says why).
flows:
  - import.yaml
  - restart.yaml
  - eviction.yaml
  - not-a-backup.yaml
  - export.yaml
  - about.yaml
  - help-links.yaml
  - offorigin-links.yaml
  - history-release.yaml
# Flows share app state (import leaves a saved fog the later ones rely on), so order matters.
executionOrder:
  continueOnFailure: false
  flowsOrder:
    - import
    - restart
    - eviction
    - not-a-backup
    - export
    - about
    - help-links
    - offorigin-links
    - history-release
