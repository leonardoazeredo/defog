flows:
  - import.yaml
  - restart.yaml
  - eviction.yaml
  - not-a-backup.yaml
  - export.yaml
  - about.yaml
  - help-links.yaml
# Flows share app state (import leaves a saved fog the later ones rely on), so order matters.
executionOrder:
  continueOnFailure: false
  flowsOrder:
    - import
    - restart
    - eviction
    - not-a-backup
    - export
    - about
    - help-links
