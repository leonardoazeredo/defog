appId: codes.madera.crossfog
---
# Fresh start avoids inheriting animation state from the prior flow
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Expand or collapse panel"
    timeout: 60000
- tapOn: "Expand or collapse panel"
- extendedWaitUntil:
    visible: "2 tiles loaded ✓"
    timeout: 30000
- tapOn: "Plan"
# Wait for the Plan pane content to finish rendering after tapping Plan
- extendedWaitUntil:
    visible: "Start drawing"
    timeout: 10000
- tapOn: "Start drawing"
# Start drawing collapses the panel to free map space; re-expand so the GPX button
# is in the accessibility tree and tappable once the route is drawn.
- tapOn: "Expand or collapse panel"
# Tap two map points to define the route the page will compute.
- tapOn:
    point: "25%, 15%"
- tapOn:
    point: "55%, 25%"
# The street fetch, routing and heights run on the device and fire an accessibility event when GPX becomes enabled.
- waitForAnimationToEnd:
    timeout: 30000
- tapOn: "GPX"
# GPX is plaintext, so the app shows a warning card before the share sheet; Continue opens it.
- extendedWaitUntil:
    visible: "This file is unencrypted.*"
    timeout: 10000
- tapOn: "Continue"
# iOS hides the file extension in the share sheet
- assertVisible: 'fogtomaps-route(\.gpx)?'
# Dismiss the share sheet so about.yaml starts on the main screen
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: "Back"
- runFlow:
    when:
      platform: iOS
    commands:
      # Tapping the dimmed area above the sheet closes it; iOS has no Back key.
      - tapOn:
          point: "50%, 8%"
