appId: codes.madera.crossfog
---
# Runs on its own, not from config.yaml: it needs the developer-only add-activity action, whose
# native half (stageForTest) exists only in a debug build, and the debug build's launches are too slow
# for the other flows' clearState-then-tap. Needs a debug build made with CROSSFOG_E2E=1 (the Release
# e2e build shows the button but ignores its message), mobile/test/fixtures/glancemap-walk.gpx pushed to
# the device's Downloads (adb push) with nothing else in there that could push it below the picker's
# fold, and the fog that import.yaml saves. No clearState: the saved fog must survive.
- runFlow: subflows/open-panel.yaml
- tapOn: "Dev: add activity from GPX"
- extendedWaitUntil:
    visible: "glancemap-walk.gpx"
    timeout: 15000
- tapOn: "glancemap-walk.gpx"
- tapOn: "History"
- extendedWaitUntil:
    visible: ".*47 steps.*"
    timeout: 15000
- tapOn: ".*47 steps.*"
# "Show on map" is on screen while the track still loads but stays disabled until it arrives.
- extendedWaitUntil:
    visible:
      text: "Show on map"
      enabled: true
    timeout: 15000
# The first tap only arms the delete; there is no dialog to confirm.
- tapOn: "Delete"
- tapOn: "Confirm delete"
- extendedWaitUntil:
    visible: "No activities yet.*"
    timeout: 15000
